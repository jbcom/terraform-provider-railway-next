fragment ServiceFields on Service {
  id
  name
  projectId
  icon
  deletedAt
}

fragment ServiceInstanceFields on ServiceInstance {
  id
  environmentId
  serviceId
  serviceName
  # **HAS THIS SERVICE EVER RUN?** Railway's own description says it
  # *"distinguishes a service that was torn down"* from one that has never
  # deployed — and `latestDeployment` is null for BOTH, so without this the two
  # are indistinguishable through the API.
  #
  # That distinction is not academic. A service with a repository attached and
  # no deployment trigger sits at `latestDeployment: null` forever while
  # reporting as correctly configured, and the only way to tell it apart from a
  # service whose deployments were removed is this field.
  hasEverDeployed
  buildCommand
  builder
  cronSchedule
  dockerfilePath
  drainingSeconds
  healthcheckPath
  healthcheckTimeout
  ipv6EgressEnabled
  numReplicas
  overlapSeconds
  preDeployCommand
  railwayConfigFile
  region
  restartPolicyMaxRetries
  restartPolicyType
  rootDirectory
  sleepApplication
  source {
    image
    repo
  }
  startCommand
  watchPatterns
  latestDeployment {
    id
    status
    createdAt
  }
}

query GetService($id: String!, $environmentId: String!) {
  service(id: $id) {
    ...ServiceFields
    repoTriggers(first: 1000) {
      edges {
        node {
          id
          environmentId
          branch
          repository
          # `provider` AND `checkSuites` ARE WHAT MAKE AN IMPORT ROUND-TRIP.
          #
          # Without them `railway_deployment_trigger`'s Read left both unset,
          # so an imported trigger planned as a REPLACEMENT — `provider_name`
          # forces replacement, and an attribute the read never fills is an
          # attribute the plan always sees as changing.
          provider
          checkSuites
        }
      }
    }
  }
  environment(id: $environmentId) {
    config(decryptVariables: false)
    serviceInstances(first: 1000) {
      edges {
        node {
          ...ServiceInstanceFields
        }
      }
    }
  }
  limitOverride: serviceInstanceLimitOverride(
    environmentId: $environmentId
    serviceId: $id
  )
}

query ListProjectServices($projectId: String!) {
  project(id: $projectId) {
    services(first: 1000) {
      edges {
        node {
          ...ServiceFields
        }
      }
    }
  }
}

mutation CreateService($input: ServiceCreateInput!) {
  serviceCreate(input: $input) {
    ...ServiceFields
  }
}

mutation UpdateService($id: String!, $input: ServiceUpdateInput!) {
  serviceUpdate(id: $id, input: $input) {
    ...ServiceFields
  }
}

mutation ConnectService($id: String!, $input: ServiceConnectInput!) {
  serviceConnect(id: $id, input: $input) {
    ...ServiceFields
  }
}

mutation UpdateServiceInstance(
  $environmentId: String!
  $serviceId: String!
  $input: ServiceInstanceUpdateInput!
) {
  serviceInstanceUpdate(
    environmentId: $environmentId
    serviceId: $serviceId
    input: $input
  )
}

mutation UpdateServiceInstanceLimits(
  $input: ServiceInstanceLimitsUpdateInput!
) {
  serviceInstanceLimitsUpdate(input: $input)
}

mutation DeleteService($id: String!, $environmentId: String) {
  serviceDelete(id: $id, environmentId: $environmentId)
}

# THE THING THAT MAKES A GITHUB-SOURCED SERVICE ACTUALLY DEPLOY.
#
# **A SERVICE CAN HAVE A REPOSITORY ATTACHED AND STILL NEVER BUILD.** The
# source tells Railway what the service is made of; the TRIGGER is what
# connects a push on a branch to a deployment. Without one the service sits
# with `latestDeployment: null` forever, and nothing in the Railway UI or the
# API says why — it looks correctly configured, because it is, apart from this.
#
# That is exactly what happened to `uat-web`, `uat-worker` and both tailnet
# nodes: sources attached, zero `repoTriggers`, no deployment ever.
mutation CreateDeploymentTrigger($input: DeploymentTriggerCreateInput!) {
  deploymentTriggerCreate(input: $input) {
    ...DeploymentTriggerFields
  }
}

mutation UpdateDeploymentTrigger($id: String!, $input: DeploymentTriggerUpdateInput!) {
  deploymentTriggerUpdate(id: $id, input: $input) {
    ...DeploymentTriggerFields
  }
}

mutation DeleteDeploymentTrigger($id: String!) {
  deploymentTriggerDelete(id: $id)
}

fragment DeploymentTriggerFields on DeploymentTrigger {
  id
  branch
  repository
  provider
  projectId
  environmentId
  serviceId
  checkSuites
}
